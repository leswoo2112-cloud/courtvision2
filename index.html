<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>COURTVISION PRO</title>

  <link rel="stylesheet" href="./style.css?v=20260904-final2">
</head>

<body>

<header class="app-header">

  <div class="brand">
    <div class="brand-mark">CV</div>

    <div class="brand-text">
      <strong>COURTVISION</strong>
      <small>PRO BASKETBALL ANALYTICS</small>
    </div>
  </div>

  <div class="mode-switch">
    <button type="button"
            data-mode="3v3"
            class="active">
      3대3
    </button>

    <button type="button"
            data-mode="5v5">
      5대5
    </button>
  </div>

  <div class="header-actions">

    <button type="button"
            id="setup">
      선수 설정
    </button>

    <button type="button"
            id="save"
            class="blue">
      경기 저장
    </button>

    <button type="button"
            id="reset"
            class="danger">
      초기화
    </button>

  </div>

</header>


<nav class="main-nav">

  <button type="button"
          data-page="live"
          class="active">
    라이브
  </button>

  <button type="button"
          data-page="records">
    기록
  </button>

  <button type="button"
          data-page="shots">
    슛차트
  </button>

  <button type="button"
          data-page="video">
    영상 분석
  </button>

  <button type="button"
          data-page="analysis">
    전력분석
  </button>

  <button type="button"
          data-page="report">
    리포트
  </button>

  <button type="button"
          data-page="league">
    리그
  </button>

</nav>


<main id="app">

  <section id="live"></section>

  <section id="records"></section>

  <section id="shots"></section>

  <section id="video"></section>

  <section id="analysis"></section>

  <section id="report"></section>

  <section id="league"></section>

</main>


<div id="modal"></div>

<div id="toast"></div>


<script src="./app.js?v=20260904-final2"></script>

</body>
</html>
