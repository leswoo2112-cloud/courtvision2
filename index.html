<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>설천고 COURTVISION PRO</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <div class="brand">
    🏀
    <b>COURTVISION<br>PRO</b>
    <small>BASKETBALL ANALYTICS SYSTEM</small>
  </div>

  <div class="modes">
    <button class="active" data-mode="3v3">3대3</button>
    <button data-mode="5v5">5대5</button>
  </div>

  <nav>
    <button class="active" data-page="live">라이브</button>
    <button data-page="records">기록</button>
    <button data-page="shots">슛차트</button>
    <button data-page="video">영상 분석</button>
    <button data-page="analysis">전력분석</button>
    <button data-page="reports">리포트</button>
    <button data-page="league">리그</button>
  </nav>

  <div class="actions">
    <button id="players">선수 설정</button>
    <button id="save">경기 저장</button>
    <button id="reset" class="danger">초기화</button>
  </div>

</header>

<main id="app"></main>

<dialog id="dlg">

  <div class="dh">
    <h2>선수 설정</h2>
    <button onclick="dlg.close()">×</button>
  </div>

  <div class="setup">

    <section>
      <h3>TEAM A · 설천고</h3>
      <div id="pa"></div>
    </section>

    <section>
      <h3>TEAM B · 상대팀</h3>
      <div id="pb"></div>
    </section>

  </div>

  <button class="primary" id="savePlayers">
    설정 저장
  </button>

</dialog>

<script src="app.js"></script>

</body>
</html>
